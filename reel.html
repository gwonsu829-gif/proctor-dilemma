<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>27년도 수능 감독관의 삶 · 릴스 스튜디오</title><link rel="stylesheet" href="style.css"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#202e29}#world,#world-hud,#world-loading{position:fixed;left:-9999px;top:0;width:720px;height:1280px}#world-canvas{width:720px;height:1280px}#reel{display:block;width:auto;height:100dvh;max-width:100vw;margin:auto;object-fit:contain}#record{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:8;padding:20px 30px;background:#e95337;color:#fff9e8;font:900 18px GameSans,sans-serif;border:2px solid #fff9e8;border-radius:16px;cursor:pointer}#status{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);background:#304b43;color:white;border-radius:6px;padding:8px 15px;font:12px sans-serif}#status a{color:#ffdf77}</style><div id="world"><canvas id="world-canvas"></canvas></div><div id="world-loading"></div><canvas id="reel" width="1080" height="1920"></canvas><button id="record">30초 3D 릴스 렌더링 시작</button><div id="status">실제 3D 장면 · 1080 × 1920 · 효과음 포함</div><script type="module" src="reel.js"></script></html>
